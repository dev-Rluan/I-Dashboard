services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: uvicorn gui.backend.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./core:/app/core:ro
      - ./gui/backend:/app/gui/backend:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
    restart: unless-stopped

  frontend:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./gui/frontend:/app
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
